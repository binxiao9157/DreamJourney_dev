<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="dreamjourney-digital-human-video" content="01.mp4">
  <meta name="dreamjourney-digital-human-motion" content="combined_data.json.gz">
  <title>DreamJourney Digital Human Live</title>
  <style>
    :root {
      color-scheme: light;
      --accent: #a86608;
      --paper: rgba(255, 252, 244, 0.92);
      --ink: #332617;
      --muted: rgba(91, 73, 48, 0.72);
      --level: 0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      letter-spacing: 0;
    }

    body {
      display: grid;
      place-items: center;
    }

    #stage {
      position: relative;
      width: min(100vw, 320px);
      aspect-ratio: 1 / 1;
      border-radius: 28px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 34%, rgba(255, 238, 204, 0.94), rgba(255, 247, 234, 0.72) 42%, rgba(254, 250, 241, 0.14) 72%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.68), rgba(255, 244, 225, 0.18));
    }

    #screen,
    #screen2,
    #canvas_video,
    #canvas_gl,
    #background_video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #screen,
    #screen2,
    #background_video {
      display: none;
    }

    #real_asset_video {
      display: none;
    }

    #canvas_video,
    #canvas_gl {
      opacity: 1;
    }

    #statusCard {
      position: absolute;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      min-width: 168px;
      max-width: 82%;
      padding: 9px 14px;
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      text-align: center;
      box-shadow: 0 12px 24px rgba(99, 68, 30, 0.16);
      border: 1px solid rgba(168, 102, 8, 0.14);
    }

    #stateLabel {
      display: block;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
    }

    #personaLabel {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #loadingSpinner,
    #startMessage,
    #characterDropdown {
      display: none;
    }

    body[data-state="failed"] #statusCard {
      border-color: rgba(186, 68, 68, 0.22);
      color: #8b3030;
    }
  </style>
</head>
<body data-state="idle">
  <div id="stage" aria-label="数字人实时面板">
    <div id="loadingSpinner">加载中</div>
    <div id="screen"></div>
    <div id="screen2"></div>
    <video id="background_video" muted playsinline loop></video>
    <video id="real_asset_video" muted playsinline loop preload="auto" src="01.mp4"></video>
    <canvas id="canvas_video"></canvas>
    <canvas id="canvas_gl"></canvas>
    <canvas id="canvasEl" aria-hidden="true" style="display: none;"></canvas>
    <div id="statusCard">
      <span id="stateLabel">数字人待机中</span>
      <span id="personaLabel">寻梦环游</span>
    </div>
    <div id="startMessage"></div>
    <select id="characterDropdown" aria-hidden="true"></select>
  </div>
  <script src="pako.min.js"></script>
  <script src="DHLiveMini.js"></script>
  <script src="MiniLive2.js"></script>
  <script src="MiniMateLoader.js"></script>
  <script>
    (function () {
      const root = document.documentElement;
      const body = document.body;
      const stateLabel = document.getElementById('stateLabel');
      const personaLabel = document.getElementById('personaLabel');
      const canvasVideo = document.getElementById('canvas_video');
      const canvasGL = document.getElementById('canvas_gl');
      const assetVideoSrc = document.querySelector('meta[name="dreamjourney-digital-human-video"]').content;
      const assetDataSrc = document.querySelector('meta[name="dreamjourney-digital-human-motion"]').content;
      const labels = {
        idle: '数字人待机中',
        listening: '正在聆听',
        thinking: '正在思考',
        speaking: '正在说话',
        stopped: '已停止',
        failed: '数字人暂不可用'
      };
      const state = {
        ready: false,
        rendererReady: false,
        failed: false,
        stateName: 'idle',
        audioLevel: 0,
        audioLevelSource: 'idle',
        lipSyncSource: 'idle',
        currentMouthShape: 'neutral',
        lipSyncFrameCount: 0,
        lipSyncAnimationHandle: null,
        personaName: '寻梦环游',
        personaSubtitle: '',
        assetVideoReady: false,
        realAssetPreviewStarted: false
      };

      function clampLevel(value) {
        const number = Number(value);
        if (!Number.isFinite(number)) {
          return 0;
        }
        return Math.max(0, Math.min(1, number));
      }

      function applyState() {
        body.dataset.state = state.stateName;
        root.style.setProperty('--level', String(state.audioLevel));
        const lift = (-1.8 * state.audioLevel).toFixed(2);
        const scale = (1 + state.audioLevel * 0.012).toFixed(4);
        const transform = 'translateY(' + lift + 'px) scale(' + scale + ')';
        if (canvasVideo) {
          canvasVideo.style.transform = transform;
        }
        if (canvasGL) {
          canvasGL.style.transform = transform;
        }
        stateLabel.textContent = labels[state.stateName] || labels.idle;
        const subtitle = state.personaSubtitle ? ' · ' + state.personaSubtitle : '';
        personaLabel.textContent = state.personaName + subtitle;
      }

      function stopVisemeTimeline() {
        if (state.lipSyncAnimationHandle !== null) {
          cancelAnimationFrame(state.lipSyncAnimationHandle);
          state.lipSyncAnimationHandle = null;
        }
      }

      function normalizedMouthShape(value) {
        const shape = String(value || 'neutral').trim();
        return shape.length > 0 ? shape : 'neutral';
      }

      function applyMouthShape(mouthShape, intensity, source) {
        const resolvedSource = String(source || 'providerVisemeTimeline');
        state.currentMouthShape = normalizedMouthShape(mouthShape);
        state.audioLevel = clampLevel(intensity);
        state.audioLevelSource = resolvedSource;
        state.lipSyncSource = resolvedSource;
        applyState();
      }

      function normalizedTimeline(timeline) {
        const source = String(timeline && timeline.source || 'providerVisemeTimeline');
        const frames = Array.isArray(timeline && timeline.frames) ? timeline.frames : [];
        const normalizedFrames = frames
          .map(function (frame) {
            return {
              timeOffset: Math.max(0, Number(frame.timeOffset) || 0),
              mouthShape: normalizedMouthShape(frame.mouthShape),
              intensity: clampLevel(frame.intensity)
            };
          })
          .sort(function (left, right) {
            return left.timeOffset - right.timeOffset;
          });
        const lastFrameTime = normalizedFrames.length > 0 ? normalizedFrames[normalizedFrames.length - 1].timeOffset : 0;
        const duration = Math.max(Number(timeline && timeline.duration) || 0, lastFrameTime + 0.12);
        return {
          source: source,
          duration: duration,
          frames: normalizedFrames
        };
      }

      function drawChromaKeyFrame(video, canvas, context) {
        if (!video.videoWidth || !video.videoHeight) {
          return;
        }
        if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        const frame = context.getImageData(0, 0, canvas.width, canvas.height);
        const pixels = frame.data;
        for (let index = 0; index < pixels.length; index += 4) {
          const red = pixels[index];
          const green = pixels[index + 1];
          const blue = pixels[index + 2];
          if (green > 120 && green > red * 1.35 && green > blue * 1.35) {
            pixels[index + 3] = 0;
          }
        }
        context.putImageData(frame, 0, 0);
      }

      function startRealAssetPreview() {
        if (state.realAssetPreviewStarted) {
          return;
        }
        state.realAssetPreviewStarted = true;
        const video = document.getElementById('real_asset_video');
        const canvas = document.getElementById('canvas_video');
        const context = canvas.getContext('2d', { willReadFrequently: true });
        if (!video || !canvas || !context) {
          window.DreamJourneyDigitalHuman.markFailed('real asset canvas unavailable');
          return;
        }

        function renderLoop() {
          if (!video.paused && !video.ended) {
            drawChromaKeyFrame(video, canvas, context);
            if (!state.assetVideoReady) {
              window.DreamJourneyDigitalHuman.markRendererReady();
            }
          }
          requestAnimationFrame(renderLoop);
        }

        const beginPlayback = function () {
          video.play()
            .then(function () {
              renderLoop();
            })
            .catch(function (error) {
              console.log('[DreamJourneyDigitalHuman] real asset video autoplay failed', error);
              window.DreamJourneyDigitalHuman.markFailed(error && error.message ? error.message : 'real asset video autoplay failed');
            });
        };

        if (video.readyState >= 2) {
          beginPlayback();
        } else {
          video.addEventListener('loadeddata', beginPlayback, { once: true });
          video.load();
        }
      }

      window.DreamJourneyDigitalHuman = {
        setState: function (stateName) {
          state.stateName = labels[stateName] ? stateName : 'idle';
          if (state.stateName === 'idle' || state.stateName === 'stopped' || state.stateName === 'failed') {
            stopVisemeTimeline();
            state.audioLevel = 0;
            state.audioLevelSource = 'idle';
            state.lipSyncSource = 'idle';
            state.currentMouthShape = 'neutral';
          }
          applyState();
        },
        setAudioLevel: function (level, source) {
          stopVisemeTimeline();
          state.audioLevel = clampLevel(level);
          state.audioLevelSource = String(source || 'unavailable');
          state.lipSyncSource = state.audioLevelSource;
          state.currentMouthShape = state.audioLevel > 0.5 ? 'open' : 'neutral';
          applyState();
        },
        setMouthShape: function (mouthShape, intensity, source) {
          stopVisemeTimeline();
          applyMouthShape(mouthShape, intensity, source);
        },
        setVisemeTimeline: function (timeline) {
          stopVisemeTimeline();
          const normalized = normalizedTimeline(timeline || {});
          state.lipSyncSource = normalized.source;
          state.audioLevelSource = normalized.source;
          state.lipSyncFrameCount = normalized.frames.length;
          if (normalized.frames.length === 0) {
            applyMouthShape('neutral', 0, normalized.source);
            return;
          }
          const startedAt = performance.now();
          const tick = function (now) {
            const elapsed = (now - startedAt) / 1000;
            let activeFrame = normalized.frames[0];
            for (let index = 0; index < normalized.frames.length; index += 1) {
              if (normalized.frames[index].timeOffset <= elapsed) {
                activeFrame = normalized.frames[index];
              } else {
                break;
              }
            }
            applyMouthShape(activeFrame.mouthShape, activeFrame.intensity, normalized.source);
            if (elapsed <= normalized.duration) {
              state.lipSyncAnimationHandle = requestAnimationFrame(tick);
            } else {
              state.lipSyncAnimationHandle = null;
            }
          };
          state.lipSyncAnimationHandle = requestAnimationFrame(tick);
        },
        setPersona: function (name, subtitle) {
          state.personaName = String(name || '寻梦环游');
          state.personaSubtitle = String(subtitle || '');
          applyState();
        },
        markRendererReady: function () {
          state.rendererReady = true;
          state.assetVideoReady = true;
          state.failed = false;
          applyState();
        },
        markFailed: function () {
          state.failed = true;
          state.stateName = 'failed';
          applyState();
        },
        snapshot: function () {
          return JSON.stringify({
            ready: state.ready,
            rendererReady: state.rendererReady,
            failed: state.failed,
            stateName: state.stateName,
            audioLevel: state.audioLevel,
            audioLevelSource: state.audioLevelSource,
            lipSyncSource: state.lipSyncSource,
            currentMouthShape: state.currentMouthShape,
            lipSyncFrameCount: state.lipSyncFrameCount,
            personaName: state.personaName,
            personaSubtitle: state.personaSubtitle,
            hasRealDigitalHumanAsset: true,
            assetVideoReady: state.assetVideoReady,
            assetVideoSrc: assetVideoSrc,
            assetDataSrc: assetDataSrc,
            hasFallbackAvatar: false
          });
        }
      };

      window.addEventListener('error', function (event) {
        console.log('[DreamJourneyDigitalHuman] renderer error', event.message);
      });

      window.addEventListener('load', function () {
        state.ready = true;
        startRealAssetPreview();
        applyState();
      });

      applyState();
    })();
  </script>
</body>
</html>
