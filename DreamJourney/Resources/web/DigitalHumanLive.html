<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DreamJourney Digital Human Live</title>
  <style>
    :root {
      color-scheme: light;
      --accent: #a86608;
      --paper: rgba(255, 252, 244, 0.92);
      --ink: #332617;
      --muted: rgba(91, 73, 48, 0.72);
      --level: 0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      letter-spacing: 0;
    }

    body {
      display: grid;
      place-items: center;
    }

    #stage {
      position: relative;
      width: min(100vw, 320px);
      aspect-ratio: 1 / 1;
      border-radius: 28px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 34%, rgba(255, 238, 204, 0.94), rgba(255, 247, 234, 0.72) 42%, rgba(254, 250, 241, 0.14) 72%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.68), rgba(255, 244, 225, 0.18));
    }

    #screen,
    #screen2,
    #canvas_video,
    #canvas_gl,
    #background_video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #screen,
    #screen2,
    #background_video {
      display: none;
    }

    #canvas_video,
    #canvas_gl {
      opacity: 0.72;
      mix-blend-mode: multiply;
    }

    #fallbackAvatar {
      position: absolute;
      inset: 10%;
      display: grid;
      place-items: center;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .head {
      position: relative;
      width: 58%;
      aspect-ratio: 0.82 / 1;
      border-radius: 46% 46% 42% 42%;
      background:
        radial-gradient(circle at 38% 28%, rgba(255, 255, 255, 0.9), transparent 24%),
        linear-gradient(180deg, #f1d8b6, #d7a56c);
      box-shadow: inset 0 -16px 28px rgba(111, 70, 24, 0.18), 0 18px 34px rgba(88, 58, 20, 0.16);
      transform: translateY(calc(var(--level) * -3px));
      transition: transform 90ms linear;
    }

    .hair {
      position: absolute;
      left: -2%;
      right: -2%;
      top: -3%;
      height: 30%;
      border-radius: 48% 48% 22% 22%;
      background: linear-gradient(160deg, #5a3d24, #856038);
    }

    .eye {
      position: absolute;
      top: 45%;
      width: 8%;
      height: 7%;
      border-radius: 999px;
      background: #5a3920;
    }

    .eye.left {
      left: 32%;
    }

    .eye.right {
      right: 32%;
    }

    .mouth {
      position: absolute;
      left: 39%;
      top: 64%;
      width: 22%;
      height: calc(5% + var(--level) * 16%);
      min-height: 7px;
      border-radius: 999px;
      background: linear-gradient(180deg, #7b361f, #3f170d);
      transform-origin: center top;
      transition: height 70ms linear;
    }

    #statusCard {
      position: absolute;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      min-width: 168px;
      max-width: 82%;
      padding: 9px 14px;
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      text-align: center;
      box-shadow: 0 12px 24px rgba(99, 68, 30, 0.16);
      border: 1px solid rgba(168, 102, 8, 0.14);
    }

    #stateLabel {
      display: block;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
    }

    #personaLabel {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #loadingSpinner,
    #startMessage,
    #characterDropdown {
      display: none;
    }

    body[data-state="listening"] .head {
      filter: saturate(1.1);
    }

    body[data-state="thinking"] .head {
      filter: saturate(0.88) brightness(1.02);
    }

    body[data-state="failed"] #statusCard {
      border-color: rgba(186, 68, 68, 0.22);
      color: #8b3030;
    }
  </style>
</head>
<body data-state="idle">
  <div id="stage" aria-label="数字人实时面板">
    <div id="loadingSpinner">加载中</div>
    <div id="screen"></div>
    <div id="screen2"></div>
    <video id="background_video" muted playsinline loop></video>
    <canvas id="canvas_video"></canvas>
    <canvas id="canvas_gl"></canvas>
    <canvas id="canvasEl" aria-hidden="true" style="display: none;"></canvas>
    <div id="fallbackAvatar">
      <div class="head">
        <div class="hair"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
      </div>
    </div>
    <div id="statusCard">
      <span id="stateLabel">数字人待机中</span>
      <span id="personaLabel">寻梦环游</span>
    </div>
    <div id="startMessage"></div>
    <select id="characterDropdown" aria-hidden="true"></select>
  </div>
  <script src="pako.min.js"></script>
  <script src="DHLiveMini.js"></script>
  <script src="MiniLive2.js"></script>
  <script src="MiniMateLoader.js"></script>
  <script>
    (function () {
      const root = document.documentElement;
      const body = document.body;
      const stateLabel = document.getElementById('stateLabel');
      const personaLabel = document.getElementById('personaLabel');
      const fallbackAvatar = document.getElementById('fallbackAvatar');
      const labels = {
        idle: '数字人待机中',
        listening: '正在聆听',
        thinking: '正在思考',
        speaking: '正在说话',
        stopped: '已停止',
        failed: '数字人暂不可用'
      };
      const state = {
        ready: false,
        rendererReady: false,
        failed: false,
        stateName: 'idle',
        audioLevel: 0,
        personaName: '寻梦环游',
        personaSubtitle: ''
      };

      function clampLevel(value) {
        const number = Number(value);
        if (!Number.isFinite(number)) {
          return 0;
        }
        return Math.max(0, Math.min(1, number));
      }

      function applyState() {
        body.dataset.state = state.stateName;
        root.style.setProperty('--level', String(state.audioLevel));
        stateLabel.textContent = labels[state.stateName] || labels.idle;
        const subtitle = state.personaSubtitle ? ' · ' + state.personaSubtitle : '';
        personaLabel.textContent = state.personaName + subtitle;
        fallbackAvatar.style.opacity = state.rendererReady ? '0.42' : '1';
      }

      window.DreamJourneyDigitalHuman = {
        setState: function (stateName) {
          state.stateName = labels[stateName] ? stateName : 'idle';
          if (state.stateName === 'idle' || state.stateName === 'stopped' || state.stateName === 'failed') {
            state.audioLevel = 0;
          }
          applyState();
        },
        setAudioLevel: function (level) {
          state.audioLevel = clampLevel(level);
          applyState();
        },
        setPersona: function (name, subtitle) {
          state.personaName = String(name || '寻梦环游');
          state.personaSubtitle = String(subtitle || '');
          applyState();
        },
        markRendererReady: function () {
          state.rendererReady = true;
          applyState();
        },
        markFailed: function () {
          state.failed = true;
          state.stateName = 'failed';
          applyState();
        },
        snapshot: function () {
          return JSON.stringify({
            ready: state.ready,
            rendererReady: state.rendererReady,
            failed: state.failed,
            stateName: state.stateName,
            audioLevel: state.audioLevel,
            personaName: state.personaName,
            personaSubtitle: state.personaSubtitle,
            hasFallbackAvatar: true
          });
        }
      };

      window.addEventListener('error', function (event) {
        console.log('[DreamJourneyDigitalHuman] renderer error', event.message);
      });

      window.addEventListener('load', function () {
        state.ready = true;
        if (document.getElementById('canvas_video')) {
          state.rendererReady = true;
        }
        applyState();
      });

      applyState();
    })();
  </script>
</body>
</html>
